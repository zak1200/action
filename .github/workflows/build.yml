name: Check and build booking site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, curl, openssl
          tools: composer:v2
      - run: composer install --working-dir=server --no-interaction --prefer-dist --no-dev
      - run: node --check app.js
      - run: node --check booking.js && node --check admin.js
      - run: php tests/backend.php
      - run: node scripts/build.mjs --php
      - uses: actions/upload-artifact@v4
        with:
          name: action-etranger-booking-site
          path: dist/
